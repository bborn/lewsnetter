# Weekly dependency and static security checks, so a newly published advisory
# fails loudly even when nobody pushes. PRs run the same brakeman and
# bundler-audit steps inside ci-cd-pipeline.yml, which already has the gems
# installed; running them here too cost two extra bundle installs per push.
name: "Security"
on:
  schedule:
    - cron: "17 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundler-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version-file: .ruby-version
          bundler-cache: true
      # Ignored advisories, each with its reason, live in .bundler-audit.yml.
      - run: bundle exec bundle-audit check --update

  brakeman:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version-file: .ruby-version
          bundler-cache: true
      # Reviewed false positives are recorded, with notes, in config/brakeman.ignore.
      - run: bundle exec brakeman --no-pager --quiet -w1
